# Bloque de servidor nginx de ejemplo (proxy inverso con HTTPS).
# Ajuste server_name y las rutas del certificado institucional.
server {
    listen 443 ssl http2;
    server_name enjambre-ia.utp.edu.co;

    ssl_certificate     /etc/ssl/utp/fullchain.pem;
    ssl_certificate_key /etc/ssl/utp/privkey.pem;

    # Solo se expone la API del servicio
    location ~ ^/(api/generar|healthz) {
        proxy_pass           http://127.0.0.1:8020;
        proxy_set_header     Host $host;
        proxy_set_header     X-Forwarded-For $remote_addr;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   150s;
        client_max_body_size 256k;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name enjambre-ia.utp.edu.co;
    return 301 https://$host$request_uri;
}
