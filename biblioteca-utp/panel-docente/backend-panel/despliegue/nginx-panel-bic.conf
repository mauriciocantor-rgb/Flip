# Bloque de servidor nginx de ejemplo (proxy inverso con HTTPS).
# Ajuste server_name y las rutas del certificado institucional.
server {
    listen 443 ssl http2;
    server_name panel-bic.utp.edu.co;

    ssl_certificate     /etc/ssl/utp/fullchain.pem;
    ssl_certificate_key /etc/ssl/utp/privkey.pem;

    # Solo se expone la API del panel
    location ~ ^/(api/sesiones|healthz) {
        proxy_pass         http://127.0.0.1:8020;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name panel-bic.utp.edu.co;
    return 301 https://$host$request_uri;
}
